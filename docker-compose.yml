services:
  postgres:
    image: postgres:16-alpine
    container_name: truck_business_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: truck_business
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - truck_business_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d truck_business"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  truck_business_postgres_data:
